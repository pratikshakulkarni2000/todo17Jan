<ng-container>
    <ul class="list-group">
        <li *ngFor="let t of getData" class="list-group-item d-flex justify-content-between align-items-center">
            <strong>
                {{t.todoItem}}
            </strong>

            <div>
                <button (click)="onEdit(t)" mat-raised-button color="primary" class="mr-2">edit</button>
                <button (click)="onRemove(t)" mat-raised-button color="warn">delete</button>
            </div>
        </li>
    </ul>
</ng-container>
