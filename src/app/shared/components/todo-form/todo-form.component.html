<div class="card">
    <div class="card-body">
        <form #todoForm="ngForm" (ngSubmit)="onAdd()">
            <div class="form-group">
                <label for="todoItem">todoItem</label>
                <input 
                ngModel
                #todoItem="ngModel"
                name="todoItem"
                required
                type="text" class="form-control">

                <strong class="text-danger" *ngIf="todoItem.touched && todoItem.hasError('required')">
                    TodoItem is an required field !!!
                </strong>
            </div>
            <button *ngIf="!isInEditMode" mat-raised-button color="primary" class="w-100">Add Todo</button>
            <button (click)="onUpdate()" *ngIf="isInEditMode" mat-raised-button color="primary" class="w-100">Update Todo</button>
        </form>
    </div>
</div>
